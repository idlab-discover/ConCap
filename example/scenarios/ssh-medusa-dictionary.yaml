type: single-target
attacker:
  name: medusa
  image: ghcr.io/idlab-discover/concap/medusa:ubuntu24
  atkCommand: medusa -h $TARGET_IP -u iscxtap -P /usr/share/wordlists/2023-200_most_used_passwords.txt -M ssh -t 4 -f -v 6
  atkTime: 45s
  cpuRequest: 250m
  memRequest: 256Mi
target:
  name: openssh-server
  image: ghcr.io/idlab-discover/concap/openssh-server:cic18
  cpuRequest: 200m
  memRequest: 256Mi
  startupProbe:
    tcpSocket:
      port: 22
    periodSeconds: 1
    failureThreshold: 30
network:
  bandwidth: 100Mbit
  queueSize: 100ms
  delay: 1ms
  jitter: 0ms
  loss: 0%
labels:
  label: "1"
  category: credential-access
  subcategory: ssh-dictionary-medusa
  service: ssh
  mitreTechnique: T1110.001
