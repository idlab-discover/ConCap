type: single-target
attacker:
  name: hydra
  image: ghcr.io/idlab-discover/concap/hydra:ubuntu24
  atkCommand: hydra -l iscxtap -P /usr/share/wordlists/2023-200_most_used_passwords.txt -t 4 -f -V ssh://$TARGET_IP
  atkTime: 45s
  cpuRequest: 250m
  memRequest: 256Mi
target:
  name: openssh-server
  image: ghcr.io/idlab-discover/concap/openssh-server:cic18
  cpuRequest: 200m
  memRequest: 256Mi
  startupProbe:
    tcpSocket:
      port: 22
    periodSeconds: 1
    failureThreshold: 30
network:
  bandwidth: 100Mbit
  queueSize: 100ms
  delay: 1ms
  jitter: 0ms
  loss: 0%
labels:
  label: "1"
  category: credential-access
  subcategory: ssh-dictionary-hydra
  service: ssh
  mitreTechnique: T1110.001
